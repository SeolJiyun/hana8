spring:
  application:
    name: hanaro

  config:
    import: classpath:security.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hanarodb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: hanaro
    password: "12345678"

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true
        time_zone: Asia/Seoul

  sql:
    init:
      mode: never

  servlet:
    multipart:
      location: src/main/resources/static/tmp
      max-request-size: 10MB
      max-file-size: 2MB

upload:
  path: src/main/resources/static/upload

management:
  server:
    port: 9001
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: env,beans
  endpoint:
    metrics:
      access: read_only
    shutdown:
      access: unrestricted
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger.html
  api-docs:
    enabled: true
    path: /hanaro/api-docs
