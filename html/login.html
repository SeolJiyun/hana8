<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-banillaJS</title>
    <style>
        form {
            border: 1px solid skyblue;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 1rem;
            border-radius: .5rem;
        }

        input {
            padding: 2px 5px;
        }

        .buttons > button {
            text-transform: capitalize;
        }
        .text-center {
            text-align: center;
        }
    </style>
    <script src ="../js/login.js" defer></script>
</head>
    <h1  class="text-center">Sign In</h1>
    <form>
        <input type="email" id="email" placeholder="email@abc.com..">
        <input type="password" id="password" placeholder="password...">
        <div  class="buttons text-center">
            <button>Cancel</button>
            <button id="frm">Login</button>
        </div>

        <div id="sign-out" class="sign-out text-center">
            <p><strong id="login-email">...</strong>logined</p>
            <button id="btn-logout" onclick="logout()">Logout</button>
        </div>
    </form>
    
</body>
</html>
